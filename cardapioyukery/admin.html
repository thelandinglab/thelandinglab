<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel Yukery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2B1A12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  body { background: #FBF8F4; }
  body::before { background: var(--cafe); }

  /* login */
  .login { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding-block: 32px; }
  .login-caixa { width: 100%; max-width: 380px; display: grid; gap: 18px; text-align: center; justify-items: center; }
  .login-caixa h1 { font-size: 30px; font-weight: 800; }
  .login-caixa p { margin: -8px 0 0; color: var(--cafe-suave); }
  .login-caixa form { width: 100%; display: grid; gap: 12px; text-align: left; }
  .dica-teste { font-size: 13px; background: var(--creme); border-radius: 12px; padding: 10px 12px; color: var(--cafe); }

  /* cabeçalho do painel */
  .cab { background: var(--cafe); color: var(--papel); position: relative; overflow: hidden; isolation: isolate; }
  .cab::before { content: ""; position: absolute; z-index: -1; width: 280px; aspect-ratio: 1; border-radius: 50%; background: var(--ambar); right: -120px; top: -170px; }
  .cab::after { content: ""; position: absolute; z-index: -1; width: 120px; aspect-ratio: 1; border-radius: 50%; border: 14px solid rgba(244, 178, 27, .35); right: 70px; top: -70px; }
  .cab .wrap { display: flex; align-items: center; gap: 12px; padding-block: 16px; }
  .cab img { width: 44px; height: 44px; border-radius: 50%; flex: none; }
  .cab h1 { font-size: 21px; font-weight: 800; }
  .cab h1 span { display: block; font: 500 13px var(--f-texto); opacity: .75; }
  .cab .sair { margin-left: auto; background: rgba(255,255,255,.12); color: var(--papel); border: 0; border-radius: 99px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
  .links { display: flex; gap: 8px; padding-bottom: 16px; flex-wrap: wrap; }
  .links a { color: var(--cafe); background: var(--ambar-vivo); text-decoration: none; font-weight: 700; font-size: 14px; padding: 8px 14px; border-radius: 99px; display: inline-flex; gap: 6px; align-items: center; }
  .links a.sec { background: rgba(255,255,255,.14); color: var(--papel); }

  .faixa-teste { background: var(--creme); border-bottom: 1px solid var(--linha); font-size: 14px; }
  .faixa-teste .wrap { padding-block: 10px; }

  .abas { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(251, 248, 244, .95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--linha); }
  .abas .wrap { display: flex; gap: 6px; padding-block: 10px; }
  .aba { flex: 1; border: 0; background: none; padding: 10px; border-radius: 99px; font-weight: 700; color: var(--cafe-suave); }
  .aba[aria-selected="true"] { background: var(--cafe); color: var(--papel); }

  .painel { padding-block: 20px 140px; display: grid; gap: 18px; }
  .resumo-topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .resumo-topo p { margin: 0; color: var(--cafe-suave); }

  .bloco { background: var(--papel); border: 1px solid var(--linha); border-radius: 20px; overflow: hidden; }
  .bloco-cab { display: flex; align-items: center; gap: 8px; padding: 14px 12px 14px 18px; border-bottom: 1px solid var(--linha); }
  .bloco-cab h2 { font-size: 20px; font-weight: 800; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .mini { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--creme); display: grid; place-items: center; color: var(--cafe); flex: none; }
  .mini[disabled] { opacity: .3; }
  .linha-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 12px; border-bottom: 1px solid var(--linha); }
  .linha-item:last-of-type { border-bottom: 0; }
  .linha-item .abrir { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 0; text-align: left; }
  .thumb { width: 52px; height: 52px; border-radius: 12px; overflow: hidden; flex: none; background: var(--creme); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb .sem-foto { font-size: 20px; }
  .li-txt { min-width: 0; display: grid; }
  .li-txt b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .li-txt span { font-size: 14px; color: var(--cafe-suave); font-variant-numeric: tabular-nums; }
  .linha-item.esg .li-txt b { text-decoration: line-through; opacity: .6; }
  .add-item { width: 100%; border: 0; background: none; padding: 14px 18px; text-align: left; font-weight: 700; color: var(--ambar-escuro); display: flex; gap: 8px; align-items: center; border-top: 1px solid var(--linha); }

  /* switch */
  .switch { position: relative; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; flex: none; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch .trilho { width: 46px; height: 28px; border-radius: 99px; background: #DCD3CB; position: relative; transition: background .2s; flex: none; }
  .switch .trilho::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--papel); box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s cubic-bezier(.16,1,.3,1); }
  .switch input:checked + .trilho { background: var(--verde); }
  .switch input:checked + .trilho::after { transform: translateX(18px); }
  .switch input:focus-visible + .trilho { outline: 3px solid var(--ambar-vivo); outline-offset: 2px; }
  .switch .rot-sw { font-size: 13px; font-weight: 600; color: var(--cafe-suave); }

  .form-bloco { padding: 18px; display: grid; gap: 14px; }
  .form-bloco h3 { font-size: 18px; font-weight: 800; }
  .form-bloco > p { margin: -8px 0 0; color: var(--cafe-suave); font-size: 14px; }
  .campo > span { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .nc { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: #F1ECE8; color: var(--cafe-suave); }
  .campo:not([data-vazio]) .nc { display: none; }
  .duas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .linha-sw { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0; }
  .linha-sw div { min-width: 0; }
  .linha-sw b { display: block; }
  .linha-sw small { color: var(--cafe-suave); font-size: 13px; }

  .hora { display: grid; grid-template-columns: 84px 1fr; gap: 8px 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--linha); }
  .hora:last-child { border-bottom: 0; }
  .hora b { font-size: 15px; }
  .hora .hh { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; }
  .hora .hh input { flex: 1; min-width: 0; padding: 10px; }
  .hora select { padding: 10px; }

  .lista-mini { display: grid; gap: 8px; }
  .lista-mini .lm { display: grid; grid-template-columns: 1fr 96px 36px; gap: 8px; align-items: center; }
  .lista-mini .entrada { padding: 10px 12px; }
  .btn-texto { border: 0; background: none; color: var(--ambar-escuro); font-weight: 700; padding: 6px 0; justify-self: start; display: inline-flex; gap: 6px; align-items: center; }

  /* editor de item */
  .ed-foto { margin: -22px -20px 4px; aspect-ratio: 16 / 10; background: var(--creme); position: relative; overflow: hidden; display: grid; place-items: center; }
  .ed-foto img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .ed-foto .acoes-foto { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 8px; }
  .ed-foto .acoes-foto button, .ed-foto .acoes-foto label { background: rgba(43, 26, 18, .85); color: var(--papel); border: 0; border-radius: 99px; padding: 9px 14px; font-weight: 700; font-size: 14px; cursor: pointer; }
  .ed-foto .vazia { display: grid; justify-items: center; gap: 8px; color: var(--ambar-escuro); font-weight: 700; cursor: pointer; padding: 20px; }
  .ed-foto .carregando { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255,245,227,.85); font-weight: 700; }
  .ed-campos { display: grid; gap: 14px; margin-top: 18px; }
  .ed-rodape { display: flex; gap: 10px; margin-top: 22px; position: sticky; bottom: 0; background: var(--papel); padding-block: 12px 4px; }
  .ed-rodape .btn { flex: 1; }
  .btn-perigo-claro { background: #FBE9E6; color: var(--vermelho); }

  /* barra salvar */
  .barra-salvar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    transform: translateY(110%); transition: transform .3s cubic-bezier(.16,1,.3,1);
  }
  .barra-salvar.mostra { transform: none; }
  .barra-salvar .dentro { max-width: 688px; margin: 0 auto; background: var(--cafe); color: var(--papel); border-radius: 99px; display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 20px; box-shadow: 0 14px 30px -10px rgba(43, 26, 18, .6); }
  .barra-salvar span { font-weight: 600; font-size: 15px; flex: 1; min-width: 0; }
  .barra-salvar .btn { padding: 12px 20px; }
  .menu-op { display: grid; gap: 8px; margin-top: 16px; }
  .menu-op button { text-align: left; border: 0; background: var(--creme); padding: 14px 16px; border-radius: 14px; font-weight: 700; }
  .menu-op button.perigo { color: var(--vermelho); background: #FBE9E6; }
</style>
</head>
<body>

<!-- LOGIN -->
<section class="login wrap" id="tela-login">
  <div class="login-caixa">
    <div class="selo-logo"><img id="logo-login" alt=""></div>
    <h1 id="titulo-login">Painel do cardápio</h1>
    <p>Entre com a senha para editar.</p>
    <form id="form-login">
      <label class="campo"><span>Senha</span><input class="entrada" id="senha" type="password" autocomplete="current-password" required></label>
      <p class="erro-msg" id="erro-login" hidden style="color:var(--vermelho);font-weight:600;margin:0"></p>
      <button class="btn btn-principal btn-largo" id="btn-entrar">Entrar</button>
      <p class="dica-teste" id="dica-teste" hidden>Modo de teste: a senha é <b>1234</b>. As alterações ficam salvas só neste navegador.</p>
    </form>
  </div>
</section>

<!-- APP -->
<div id="tela-app" hidden>
  <header class="cab">
    <div class="wrap">
      <img id="logo-cab" alt="">
      <h1><span>Painel</span><b id="nome-cab"></b></h1>
      <button class="sair" id="sair">Sair</button>
    </div>
    <div class="wrap links">
      <a href="cardapio.html" target="_blank" rel="noopener">Ver cardápio</a>
      <a class="sec" href="pedido.html" target="_blank" rel="noopener">Ver Peça Aqui</a>
    </div>
  </header>
  <div class="faixa-teste" id="faixa-teste" hidden><div class="wrap">Modo de teste: tudo fica salvo só neste navegador. Para valer para os clientes, conecte a planilha.</div></div>

  <nav class="abas" aria-label="Seções do painel">
    <div class="wrap" role="tablist">
      <button class="aba" role="tab" aria-selected="true" data-aba="cardapio">Cardápio</button>
      <button class="aba" role="tab" aria-selected="false" data-aba="loja">Loja</button>
      <button class="aba" role="tab" aria-selected="false" data-aba="pedidos">Pedidos</button>
    </div>
  </nav>

  <main class="wrap painel" id="p-cardapio"></main>
  <main class="wrap painel" id="p-loja" hidden></main>
  <main class="wrap painel" id="p-pedidos" hidden></main>

  <div class="barra-salvar" id="barra-salvar">
    <div class="dentro"><span>Alterações não salvas</span><button class="btn btn-ambar" id="salvar">Salvar</button></div>
  </div>
</div>

<input type="file" id="arquivo-foto" accept="image/*" hidden>

<script src="config.js"></script>
<script src="assets.js"></script>
<script src="core.js"></script>
<script>
(function () {
  const C = window.Cardapio, $ = (s, r) => (r || document).querySelector(s);
  const KSENHA = "cardapio:" + (C.CFG.LOJA_ID || "demo") + ":sessao";
  let D = null, snap = "", senha = "";

  const ICON = {
    cima: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    baixo: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    mais: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>',
    menu: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></svg>',
    x: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>',
    camera: '<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>'
  };

  const num = (v) => { v = String(v == null ? "" : v).trim(); if (!v) return null; v = v.includes(",") ? v.replace(/\./g, "").replace(",", ".") : v; const n = parseFloat(v.replace(/[^\d.]/g, "")); return isNaN(n) ? null : n; };
  const numTxt = (n) => (n == null || n === "" ? "" : String(n).replace(".", ","));
  const sujo = () => JSON.stringify(D) !== snap;
  const marcar = () => $("#barra-salvar").classList.toggle("mostra", sujo());

  function getP(path) { return path.split(".").reduce((o, k) => (o == null ? o : o[k]), D); }
  function setP(path, v) { const ks = path.split("."); const last = ks.pop(); ks.reduce((o, k) => o[k], D)[last] = v; }

  /* ---------- login ---------- */
  async function iniciar() {
    D = await C.carregar();
    $("#logo-login").src = C.logo(D.loja);
    $("#titulo-login").textContent = "Painel " + D.loja.nome;
    $("#dica-teste").hidden = !C.TESTE;
    let s = null; try { s = sessionStorage.getItem(KSENHA); } catch (e) {}
    if (s && (await C.entrar(s))) abrirApp(s);
  }
  $("#form-login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const b = $("#btn-entrar"); b.disabled = true; b.textContent = "Entrando…";
    let ok = false;
    try { ok = await C.entrar($("#senha").value); } catch (err) {}
    b.disabled = false; b.textContent = "Entrar";
    if (!ok) { const er = $("#erro-login"); er.textContent = "Senha incorreta. Confira e tente de novo."; er.hidden = false; return; }
    abrirApp($("#senha").value);
  });
  function abrirApp(s) {
    senha = s;
    try { sessionStorage.setItem(KSENHA, s); } catch (e) {}
    snap = JSON.stringify(D);
    $("#tela-login").hidden = true;
    $("#tela-app").hidden = false;
    $("#faixa-teste").hidden = !C.TESTE;
    cabecalho(); renderCardapio(); renderLoja(); renderPedidos();
  }
  $("#sair").onclick = () => { try { sessionStorage.removeItem(KSENHA); } catch (e) {} location.reload(); };
  function cabecalho() { $("#logo-cab").src = C.logo(D.loja); $("#nome-cab").textContent = D.loja.nome; }

  /* ---------- abas ---------- */
  document.querySelectorAll(".aba").forEach((a) => (a.onclick = () => {
    document.querySelectorAll(".aba").forEach((x) => x.setAttribute("aria-selected", String(x === a)));
    ["cardapio", "loja", "pedidos"].forEach((p) => ($("#p-" + p).hidden = p !== a.dataset.aba));
    window.scrollTo({ top: 0 });
  }));

  /* ---------- aba cardápio ---------- */
  function renderCardapio() {
    const el = $("#p-cardapio");
    const ni = D.itens.length, nc = D.categorias.length;
    let h = '<div class="resumo-topo"><p>' + ni + (ni === 1 ? " item" : " itens") + " em " + nc + (nc === 1 ? " categoria" : " categorias") + '</p><button class="btn btn-principal" id="nova-cat">' + ICON.mais + "Nova categoria</button></div>";
    if (!nc) {
      h += '<div class="vazio"><div class="disco">' + ICON.mais + '</div><h3>Comece pela primeira categoria</h3><p>Por exemplo: Lanches, Porções ou Bebidas. Depois você adiciona os itens dentro dela.</p></div>';
    }
    D.categorias.forEach((c, ci) => {
      const its = D.itens.filter((i) => i.catId === c.id);
      h += '<section class="bloco" data-cat="' + c.id + '"><div class="bloco-cab"><h2>' + C.esc(c.nome) + (c.oculta ? ' <span class="tag cinza">Oculta</span>' : "") + "</h2>" +
        '<button class="mini" data-acao="cat-cima" aria-label="Subir categoria"' + (ci === 0 ? " disabled" : "") + ">" + ICON.cima + "</button>" +
        '<button class="mini" data-acao="cat-baixo" aria-label="Descer categoria"' + (ci === nc - 1 ? " disabled" : "") + ">" + ICON.baixo + "</button>" +
        '<button class="mini" data-acao="cat-menu" aria-label="Opções da categoria">' + ICON.menu + "</button></div>";
      its.forEach((i) => {
        h += '<div class="linha-item' + (i.esgotado ? " esg" : "") + '" data-item="' + i.id + '"><button class="abrir" data-acao="editar"><span class="thumb">' +
          (i.foto ? '<img src="' + C.esc(i.foto) + '" alt="">' : '<span class="sem-foto">' + C.esc((i.nome || "?").charAt(0)) + "</span>") +
          '</span><span class="li-txt"><b>' + C.esc(i.nome) + "</b><span>" + (i.preco != null ? C.brl(i.preco) : "Sem preço") + (i.destaque ? " (destaque)" : "") + "</span></span></button>" +
          '<label class="switch"><input type="checkbox" role="switch" data-acao="disp"' + (i.esgotado ? "" : " checked") + ' aria-label="' + C.esc(i.nome) + ' disponível"><span class="trilho"></span></label></div>';
      });
      h += '<button class="add-item" data-acao="novo-item">' + ICON.mais + "Adicionar item</button></section>";
    });
    el.innerHTML = h;
  }

  $("#p-cardapio").addEventListener("click", async (e) => {
    if (e.target.closest("#nova-cat")) return editarCategoria();
    const b = e.target.closest("[data-acao]");
    if (!b || b.dataset.acao === "disp") return;
    const catEl = b.closest("[data-cat]"), itEl = b.closest("[data-item]");
    const cid = catEl && catEl.dataset.cat;
    const idx = D.categorias.findIndex((c) => c.id === cid);
    switch (b.dataset.acao) {
      case "cat-cima": troca(D.categorias, idx, idx - 1); break;
      case "cat-baixo": troca(D.categorias, idx, idx + 1); break;
      case "cat-menu": return menuCategoria(D.categorias[idx]);
      case "novo-item": return editarItem(null, cid);
      case "editar": return editarItem(itEl.dataset.item);
    }
    renderCardapio(); marcar();
  });
  $("#p-cardapio").addEventListener("change", (e) => {
    if (e.target.dataset.acao !== "disp") return;
    const it = D.itens.find((i) => i.id === e.target.closest("[data-item]").dataset.item);
    it.esgotado = !e.target.checked;
    e.target.closest(".linha-item").classList.toggle("esg", it.esgotado);
    marcar();
  });
  function troca(arr, a, b) { if (b < 0 || b >= arr.length) return; [arr[a], arr[b]] = [arr[b], arr[a]]; }

  function editarCategoria(cat) {
    const s = C.sheet('<h3 class="sheet-titulo">' + (cat ? "Renomear categoria" : "Nova categoria") + '</h3><form id="f-cat" style="display:grid;gap:14px;margin-top:16px"><label class="campo"><span>Nome</span><input class="entrada" id="nome-cat" placeholder="Ex.: Lanches" value="' + C.esc(cat ? cat.nome : "") + '" required></label><button class="btn btn-principal">' + (cat ? "Salvar nome" : "Criar categoria") + "</button></form>");
    $("#f-cat", s.el).onsubmit = (e) => {
      e.preventDefault();
      const n = $("#nome-cat", s.el).value.trim();
      if (!n) return;
      if (cat) cat.nome = n; else D.categorias.push({ id: C.uid(), nome: n, oculta: false });
      s.fechar(); renderCardapio(); marcar();
    };
  }

  function menuCategoria(cat) {
    const n = D.itens.filter((i) => i.catId === cat.id).length;
    const s = C.sheet('<h3 class="sheet-titulo">' + C.esc(cat.nome) + '</h3><div class="menu-op"><button data-o="ren">Renomear</button><button data-o="oc">' + (cat.oculta ? "Mostrar no cardápio" : "Ocultar do cardápio") + '</button><button class="perigo" data-o="del">Excluir categoria' + (n ? " e " + n + (n === 1 ? " item" : " itens") : "") + "</button></div>", { semFoco: true });
    s.el.onclick = async (e) => {
      const o = e.target.dataset.o; if (!o) return;
      s.fechar();
      if (o === "ren") return setTimeout(() => editarCategoria(cat), 280);
      if (o === "oc") cat.oculta = !cat.oculta;
      if (o === "del") {
        await new Promise((r) => setTimeout(r, 280));
        if (!(await C.confirmar("Excluir " + cat.nome + "?", n ? "Os " + n + " itens desta categoria também serão excluídos." : "A categoria está vazia.", "Excluir"))) return;
        D.categorias = D.categorias.filter((c) => c !== cat);
        D.itens = D.itens.filter((i) => i.catId !== cat.id);
      }
      renderCardapio(); marcar();
    };
  }

  /* ---------- editor de item ---------- */
  function editarItem(id, catId) {
    const orig = id ? D.itens.find((i) => i.id === id) : null;
    const it = orig ? C.clone(orig) : { id: C.uid(), catId, nome: "", descricao: "", preco: null, foto: "", esgotado: false, destaque: false, adicionais: [] };
    const cats = D.categorias.map((c) => '<option value="' + c.id + '"' + (c.id === it.catId ? " selected" : "") + ">" + C.esc(c.nome) + "</option>").join("");
    let h = '<div class="ed-foto" id="ed-foto"></div>';
    h += '<div class="ed-campos">' +
      '<label class="campo"><span>Nome do item</span><input class="entrada" id="e-nome" value="' + C.esc(it.nome) + '" placeholder="Ex.: X-Bacon"></label>' +
      '<label class="campo"><span>Descrição</span><textarea class="entrada" id="e-desc" rows="2" placeholder="Ingredientes, tamanho, o que acompanha">' + C.esc(it.descricao || "") + "</textarea></label>" +
      '<div class="duas"><label class="campo"><span>Preço (R$)</span><input class="entrada num" id="e-preco" inputmode="decimal" placeholder="0,00" value="' + numTxt(it.preco) + '"></label>' +
      '<label class="campo"><span>Categoria</span><select class="entrada" id="e-cat">' + cats + "</select></label></div>" +
      '<div class="linha-sw"><div><b>Disponível</b><small>Desligue quando acabar. O item aparece como esgotado.</small></div><label class="switch"><input type="checkbox" role="switch" id="e-disp"' + (it.esgotado ? "" : " checked") + ' aria-label="Disponível"><span class="trilho"></span></label></div>' +
      '<div class="linha-sw"><div><b>Destaque</b><small>Aparece no topo do cardápio.</small></div><label class="switch"><input type="checkbox" role="switch" id="e-dest"' + (it.destaque ? " checked" : "") + ' aria-label="Destaque"><span class="trilho"></span></label></div>' +
      '<div class="campo"><span>Adicionais <span class="nc" style="display:inline">opcional</span></span><small>O cliente escolhe na hora de pedir. Deixe o preço vazio se for grátis.</small><div class="lista-mini" id="e-adic"></div><button type="button" class="btn-texto" id="add-adic">' + ICON.mais + "Adicionar opção</button></div>" +
      "</div>";
    if (orig) h += '<div style="display:flex;gap:8px;margin-top:14px"><button type="button" class="btn btn-claro" id="e-cima" style="flex:1">' + ICON.cima + 'Subir</button><button type="button" class="btn btn-claro" id="e-baixo" style="flex:1">' + ICON.baixo + "Descer</button></div>";
    h += '<div class="ed-rodape">' + (orig ? '<button type="button" class="btn btn-perigo-claro" id="e-del">Excluir</button>' : "") + '<button type="button" class="btn btn-principal" id="e-ok">' + (orig ? "Pronto" : "Adicionar item") + "</button></div>";
    const s = C.sheet(h, { semFoco: true });
    const el = s.el;

    function fotoUI(carregando) {
      $("#ed-foto", el).innerHTML = (it.foto ? '<img src="' + C.esc(it.foto) + '" alt=""><div class="acoes-foto"><label for="arquivo-foto">Trocar foto</label><button type="button" id="rem-foto">Remover</button></div>'
        : '<label class="vazia" for="arquivo-foto">' + ICON.camera + "Adicionar foto</label>") + (carregando ? '<div class="carregando">Enviando foto…</div>' : "");
      const r = $("#rem-foto", el); if (r) r.onclick = () => { it.foto = ""; fotoUI(); };
    }
    fotoUI();
    const inp = $("#arquivo-foto");
    inp.value = "";
    inp.onchange = async () => {
      const f = inp.files[0]; if (!f) return;
      fotoUI(true);
      try { it.foto = await C.enviarFoto(f); } catch (err) { C.toast(err.message, "erro"); }
      inp.value = ""; fotoUI();
    };

    function adicUI() {
      $("#e-adic", el).innerHTML = it.adicionais.map((a, k) => '<div class="lm" data-k="' + k + '"><input class="entrada" data-f="nome" placeholder="Ex.: Bacon extra" value="' + C.esc(a.nome) + '" aria-label="Nome do adicional"><input class="entrada num" data-f="preco" inputmode="decimal" placeholder="R$" value="' + numTxt(a.preco) + '" aria-label="Preço do adicional"><button type="button" class="mini" data-rem="' + k + '" aria-label="Remover adicional">' + ICON.x + "</button></div>").join("");
    }
    adicUI();
    $("#e-adic", el).addEventListener("input", (e) => {
      const k = e.target.closest("[data-k]").dataset.k, f = e.target.dataset.f;
      it.adicionais[k][f] = f === "preco" ? num(e.target.value) : e.target.value;
    });
    $("#e-adic", el).addEventListener("click", (e) => { const r = e.target.closest("[data-rem]"); if (r) { it.adicionais.splice(r.dataset.rem, 1); adicUI(); } });
    $("#add-adic", el).onclick = () => { it.adicionais.push({ id: C.uid(), nome: "", preco: null }); adicUI(); el.querySelector("#e-adic .lm:last-child input").focus(); };

    const mover = (d) => {
      const lista = D.itens.filter((i) => i.catId === orig.catId);
      const p = lista.indexOf(orig), alvo = lista[p + d];
      if (!alvo) return C.toast(d < 0 ? "Já é o primeiro da categoria." : "Já é o último da categoria.");
      troca(D.itens, D.itens.indexOf(orig), D.itens.indexOf(alvo));
      renderCardapio(); marcar(); C.toast(d < 0 ? "Item subiu uma posição." : "Item desceu uma posição.");
    };
    if (orig) { $("#e-cima", el).onclick = () => mover(-1); $("#e-baixo", el).onclick = () => mover(1); }

    $("#e-ok", el).onclick = () => {
      it.nome = $("#e-nome", el).value.trim();
      if (!it.nome) { $("#e-nome", el).classList.add("invalida"); $("#e-nome", el).focus(); return C.toast("Dê um nome ao item.", "erro"); }
      it.descricao = $("#e-desc", el).value.trim();
      it.preco = num($("#e-preco", el).value);
      it.catId = $("#e-cat", el).value;
      it.esgotado = !$("#e-disp", el).checked;
      it.destaque = $("#e-dest", el).checked;
      it.adicionais = it.adicionais.filter((a) => (a.nome || "").trim());
      if (orig) {
        const mudouCat = orig.catId !== it.catId;
        Object.assign(orig, it);
        if (mudouCat) { D.itens.splice(D.itens.indexOf(orig), 1); D.itens.push(orig); }
      } else D.itens.push(it);
      s.fechar(); renderCardapio(); marcar();
    };
    if (orig) $("#e-del", el).onclick = async () => {
      s.fechar();
      await new Promise((r) => setTimeout(r, 280));
      if (!(await C.confirmar("Excluir " + orig.nome + "?", "O item sai do cardápio depois que você salvar.", "Excluir item"))) return;
      D.itens = D.itens.filter((i) => i !== orig);
      renderCardapio(); marcar();
    };
  }

  /* ---------- campos genéricos (Loja e Pedidos) ---------- */
  function campo(rot, path, opts) {
    opts = opts || {};
    const v = getP(path);
    const vazio = v == null || v === "";
    const val = opts.tipo === "num" ? numTxt(v) : v == null ? "" : v;
    const tag = opts.area ? '<textarea class="entrada" rows="2" data-p="' + path + '"' + (opts.ph ? ' placeholder="' + C.esc(opts.ph) + '"' : "") + ">" + C.esc(val) + "</textarea>"
      : '<input class="entrada' + (opts.tipo === "num" ? " num" : "") + '" data-p="' + path + '"' + (opts.tipo ? ' data-t="' + opts.tipo + '"' : "") + (opts.tipo === "num" ? ' inputmode="decimal"' : "") + (opts.tel ? ' inputmode="tel"' : "") + (opts.ph ? ' placeholder="' + C.esc(opts.ph) + '"' : "") + ' value="' + C.esc(val) + '">';
    return '<label class="campo"' + (vazio ? " data-vazio" : "") + "><span>" + rot + ' <span class="nc">não configurado</span></span>' + tag + (opts.dica ? "<small>" + opts.dica + "</small>" : "") + "</label>";
  }
  function sw(rot, path, dica, inverso) {
    const v = !!getP(path);
    return '<div class="linha-sw"><div><b>' + rot + "</b>" + (dica ? "<small>" + dica + "</small>" : "") + '</div><label class="switch"><input type="checkbox" role="switch" data-p="' + path + '" data-t="bool"' + (inverso ? ' data-inv="1"' : "") + ((inverso ? !v : v) ? " checked" : "") + ' aria-label="' + C.esc(rot) + '"><span class="trilho"></span></label></div>';
  }
  function ligarCampos(el) {
    el.addEventListener("input", (e) => {
      const p = e.target.dataset.p; if (!p) return;
      const t = e.target.dataset.t;
      let v = t === "bool" ? (e.target.dataset.inv ? !e.target.checked : e.target.checked) : t === "num" ? num(e.target.value) : e.target.value;
      setP(p, v);
      const c = e.target.closest(".campo");
      if (c) c.toggleAttribute("data-vazio", v == null || v === "");
      if (p === "loja.nome") cabecalho();
      marcar();
    });
  }

  /* ---------- aba loja ---------- */
  function renderLoja() {
    const L = D.loja;
    let h = '<section class="bloco"><div class="form-bloco"><h3>Identidade</h3>' + campo("Nome da loja", "loja.nome") + campo("Frase de apresentação", "loja.slogan", { ph: "Ex.: Sabor que conquista" }) +
      '<div class="campo"><span>Foto de capa</span><div class="thumb" style="width:100%;height:auto;aspect-ratio:16/10;border-radius:14px"><img id="capa-prev" alt="Foto de capa" src="' + C.esc(C.capa(L)) + '"></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn btn-claro" id="trocar-capa">Trocar foto de capa</button>' + (L.capa ? '<button type="button" class="btn btn-claro" id="capa-padrao">Voltar para a original</button>' : "") + "</div></div></div></section>";
    h += '<section class="bloco"><div class="form-bloco"><h3>Contato</h3>' + campo("WhatsApp de pedidos", "loja.whatsapp", { tel: true, ph: "(11) 99999-9999", dica: "Os pedidos do Peça Aqui chegam neste número." }) +
      campo("Instagram", "loja.instagram", { ph: "sem o @" }) + campo("Endereço", "loja.endereco", { area: true }) + "</div></section>";
    h += '<section class="bloco"><div class="form-bloco"><h3>Avaliação no Google</h3><div class="duas">' + campo("Nota", "loja.notaGoogle", { tipo: "num", ph: "4,9" }) + campo("Nº de avaliações", "loja.avaliacoesGoogle", { tipo: "num", ph: "59" }) + "</div></div></section>";
    h += '<section class="bloco"><div class="form-bloco"><h3>Horários</h3><p>Usados para mostrar “aberto” ou “fechado” e para pausar os pedidos fora do horário.</p><div>' +
      [1, 2, 3, 4, 5, 6, 0].map((d) => {
        const x = L.horarios[d];
        return '<div class="hora" data-d="' + d + '"><b>' + C.DIAS[d] + '</b><select class="entrada" data-h="status" aria-label="' + C.DIAS[d] + '"><option value="aberto"' + (x.status === "aberto" ? " selected" : "") + '>Aberto</option><option value="fechado"' + (x.status === "fechado" ? " selected" : "") + '>Fechado</option><option value=""' + (!x.status ? " selected" : "") + ">Não configurado</option></select>" +
          '<div class="hh"' + (x.status === "aberto" ? "" : " hidden") + '><input class="entrada" type="time" data-h="abre" value="' + C.esc(x.abre) + '" aria-label="Abre"><span>às</span><input class="entrada" type="time" data-h="fecha" value="' + C.esc(x.fecha) + '" aria-label="Fecha"></div></div>';
      }).join("") + "</div></div></section>";
    h += '<section class="bloco"><div class="form-bloco"><h3>Aviso e pausa</h3>' + campo("Aviso no topo do cardápio", "loja.aviso", { area: true, ph: "Ex.: Hoje tem promoção de combo!", dica: "Deixe vazio para não mostrar nada." }) +
      sw("Fechar agora", "loja.fechadoAgora", "Pausa os pedidos na hora, mesmo dentro do horário.") + "</div></section>";
    const el = $("#p-loja");
    el.innerHTML = h;
    $("#trocar-capa", el).onclick = () => {
      const inp = $("#arquivo-foto"); inp.value = "";
      inp.onchange = async () => {
        const f = inp.files[0]; if (!f) return;
        $("#trocar-capa", el).textContent = "Enviando…";
        try { L.capa = await C.enviarFoto(f); marcar(); } catch (err) { C.toast(err.message, "erro"); }
        renderLoja();
      };
      inp.click();
    };
    const cp = $("#capa-padrao", el); if (cp) cp.onclick = () => { L.capa = ""; marcar(); renderLoja(); };
  }
  ligarCampos($("#p-loja"));
  $("#p-loja").addEventListener("change", (e) => {
    const h = e.target.dataset.h; if (!h) return;
    const d = Number(e.target.closest("[data-d]").dataset.d);
    D.loja.horarios[d][h] = e.target.value;
    if (h === "status") {
      e.target.closest(".hora").querySelector(".hh").hidden = e.target.value !== "aberto";
      if (e.target.value === "aberto" && !D.loja.horarios[d].abre) { D.loja.horarios[d].abre = "18:00"; D.loja.horarios[d].fecha = "23:00"; renderLoja(); }
    }
    marcar();
  });

  /* ---------- aba pedidos ---------- */
  function renderPedidos() {
    const L = D.loja, E = L.entrega;
    let h = '<section class="bloco"><div class="form-bloco"><h3>Como o cliente pode receber</h3>' +
      sw("Entrega", "loja.modalidades.entrega") + sw("Retirada no balcão", "loja.modalidades.retirada") + sw("Na mesa", "loja.modalidades.mesa", "O cliente informa o número da mesa.") + "</div></section>";
    h += '<section class="bloco"><div class="form-bloco"><h3>Taxa de entrega</h3>' +
      '<label class="campo"' + (E.tipo ? "" : " data-vazio") + '><span>Como cobrar <span class="nc">não configurado</span></span><select class="entrada" id="tipo-taxa"><option value=""' + (!E.tipo ? " selected" : "") + '>Combinar pelo WhatsApp</option><option value="fixa"' + (E.tipo === "fixa" ? " selected" : "") + '>Taxa fixa</option><option value="bairros"' + (E.tipo === "bairros" ? " selected" : "") + ">Taxa por bairro</option></select></label>";
    if (E.tipo === "fixa") h += campo("Valor da taxa (R$)", "loja.entrega.taxaFixa", { tipo: "num", ph: "0,00", dica: "Coloque 0 para entrega grátis." });
    if (E.tipo === "bairros") {
      h += '<div class="campo"><span>Bairros atendidos</span><div class="lista-mini" id="bairros">' + E.bairros.map((b, k) =>
        '<div class="lm" data-k="' + k + '"><input class="entrada" data-f="nome" placeholder="Bairro" value="' + C.esc(b.nome) + '" aria-label="Bairro"><input class="entrada num" data-f="taxa" inputmode="decimal" placeholder="R$" value="' + numTxt(b.taxa) + '" aria-label="Taxa"><button type="button" class="mini" data-rem="' + k + '" aria-label="Remover bairro">' + ICON.x + "</button></div>").join("") +
        '</div><button type="button" class="btn-texto" id="add-bairro">' + ICON.mais + "Adicionar bairro</button></div>";
    }
    h += "</div></section>";
    h += '<section class="bloco"><div class="form-bloco"><h3>Regras do pedido</h3>' + campo("Pedido mínimo (R$)", "loja.pedidoMinimo", { tipo: "num", ph: "0,00" }) +
      campo("Tempo médio", "loja.tempoMedio", { ph: "Ex.: 40 a 60 min" }) + "</div></section>";
    h += '<section class="bloco"><div class="form-bloco"><h3>Formas de pagamento</h3>' + sw("Pix", "loja.pagamentos.pix") + sw("Cartão de crédito", "loja.pagamentos.credito") +
      sw("Cartão de débito", "loja.pagamentos.debito") + sw("Dinheiro", "loja.pagamentos.dinheiro", "O cliente pode pedir troco.") + sw("Vale-refeição", "loja.pagamentos.vale") +
      campo("Chave Pix", "loja.chavePix", { ph: "CPF, CNPJ, e-mail ou telefone", dica: "Aparece com botão de copiar quando o cliente escolhe Pix." }) + "</div></section>";
    $("#p-pedidos").innerHTML = h;
  }
  ligarCampos($("#p-pedidos"));
  $("#p-pedidos").addEventListener("change", (e) => {
    if (e.target.id === "tipo-taxa") { D.loja.entrega.tipo = e.target.value; if (e.target.value === "bairros" && !D.loja.entrega.bairros.length) D.loja.entrega.bairros.push({ nome: "", taxa: null }); renderPedidos(); marcar(); }
  });
  $("#p-pedidos").addEventListener("input", (e) => {
    const lm = e.target.closest("#bairros [data-k]"); if (!lm) return;
    const b = D.loja.entrega.bairros[lm.dataset.k], f = e.target.dataset.f;
    b[f] = f === "taxa" ? num(e.target.value) : e.target.value;
    marcar();
  });
  $("#p-pedidos").addEventListener("click", (e) => {
    if (e.target.closest("#add-bairro")) { D.loja.entrega.bairros.push({ nome: "", taxa: null }); renderPedidos(); marcar(); const ins = document.querySelectorAll("#bairros .lm"); ins[ins.length - 1].querySelector("input").focus(); return; }
    const r = e.target.closest("#bairros [data-rem]"); if (r) { D.loja.entrega.bairros.splice(r.dataset.rem, 1); renderPedidos(); marcar(); }
  });

  /* ---------- salvar ---------- */
  $("#salvar").onclick = async () => {
    const b = $("#salvar"); b.disabled = true; b.textContent = "Salvando…";
    D.loja.entrega.bairros = D.loja.entrega.bairros.filter((x) => (x.nome || "").trim());
    try {
      await C.salvar(D, senha);
      snap = JSON.stringify(D);
      marcar();
      C.toast("Salvo. O cardápio já está atualizado.");
      renderPedidos();
    } catch (err) { C.toast(err.message, "erro"); }
    b.disabled = false; b.textContent = "Salvar";
  };
  window.addEventListener("beforeunload", (e) => { if (D && snap && sujo()) { e.preventDefault(); e.returnValue = ""; } });

  iniciar();
})();
</script>
</body>
</html>
