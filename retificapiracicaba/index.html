<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retífica em Limeira | Atendimento no WhatsApp</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --preto: #0f0f0f;
    --branco: #ffffff;
    --vermelho: #c8102e;
    --cinza-claro: #f4f4f4;
    --cinza-texto: #4a4a4a;
    --verde-wpp: #25D366;
    --verde-wpp-hover: #1ebe57;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--preto);
    color: var(--branco);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    line-height: 1.5;
  }

  .container {
    max-width: 560px;
    width: 100%;
    text-align: center;
  }

  .logo {
    display: inline-block;
    padding: 14px 24px;
    border: 2px dashed rgba(255,255,255,0.3);
    border-radius: 8px;
    margin-bottom: 40px;
    color: rgba(255,255,255,0.5);
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .selo {
    display: inline-block;
    background: var(--vermelho);
    color: var(--branco);
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  h1 {
    font-size: 42px;
    font-weight: 800;
    line-height: 1.15;
    margin-bottom: 20px;
    letter-spacing: -0.5px;
  }

  h1 span {
    color: var(--vermelho);
  }

  .subtitulo {
    font-size: 18px;
    color: rgba(255,255,255,0.75);
    margin-bottom: 36px;
    line-height: 1.5;
  }

  .btn-whatsapp {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: var(--verde-wpp);
    color: var(--branco);
    text-decoration: none;
    padding: 20px 32px;
    border-radius: 12px;
    font-size: 19px;
    font-weight: 700;
    width: 100%;
    max-width: 420px;
    margin: 0 auto 20px;
    box-shadow: 0 8px 24px rgba(37, 211, 102, 0.35);
    transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }

  .btn-whatsapp:hover {
    background: var(--verde-wpp-hover);
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(37, 211, 102, 0.45);
  }

  .btn-whatsapp:active {
    transform: translateY(0);
  }

  .btn-whatsapp svg {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
  }

  .aviso {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 14px;
    color: rgba(255,255,255,0.65);
    margin-bottom: 36px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    background: var(--verde-wpp);
    border-radius: 50%;
    box-shadow: 0 0 0 4px rgba(37, 211, 102, 0.25);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.6); }
    70% { box-shadow: 0 0 0 8px rgba(37, 211, 102, 0); }
    100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
  }

  .beneficios {
    display: flex;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
    padding-top: 28px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }

  .beneficio {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: rgba(255,255,255,0.8);
  }

  .check {
    color: var(--verde-wpp);
    font-weight: 700;
  }

  @media (max-width: 480px) {
    h1 { font-size: 32px; }
    .subtitulo { font-size: 16px; }
    .btn-whatsapp { font-size: 17px; padding: 18px 24px; }
    .beneficios { gap: 12px 20px; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="logo">SUA LOGO AQUI</div>

  <div class="selo">Atendemos Limeira e região</div>

  <h1>Precisa de <span>retífica</span> em Limeira?</h1>

  <p class="subtitulo">
    Chame no WhatsApp agora e fale direto com nossa equipe.<br>
    Respondemos na hora, com orçamento sem compromisso.
  </p>

    Chamar no WhatsApp
  </a>

  <div class="aviso">
    <span class="status-dot"></span>
    Atendimento agora online
  </div>

  <div class="beneficios">
    <div class="beneficio"><span class="check">✓</span> Orçamento na hora</div>
    <div class="beneficio"><span class="check">✓</span> Sem compromisso</div>
  </div>

</div>

<script>

  });
</script>

</body>
</html>
